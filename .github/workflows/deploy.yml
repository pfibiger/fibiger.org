name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"   # daily, about 7am Eastern
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed Instagram archive
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Instagram strip
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
        run: python3 scripts/update_instagram.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram strip"
            git push
          elif [ "${{ github.event_name }}" = "schedule" ] && \
               [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            # GitHub disables schedules on public repos after 60 days without activity
            git commit --allow-empty -m "Keep scheduled refresh active"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
